<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifying Part</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#F7F8FB;color:#1B2530;text-align:center;padding:20px}
#msg{max-width:420px;line-height:1.5;font-size:17px}
</style>
</head>
<body>
<p id="msg">Verifying part...</p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8lD0APM5hquqBb35Cszm_IahhdmBn8LxKYqK5BSLzzxh7psIHZtMO6op9z-GTW7imFg/exec";
const code = new URLSearchParams(location.search).get("c") || "";
const msg = document.getElementById("msg");
const callbackName = "verifyResult_" + Date.now();
let done = false;

function showFailure(text) {
  if (done) return;
  done = true;
  msg.textContent = text;
}

window[callbackName] = function (data) {
  if (done) return;
  done = true;
  location.replace(data && data.status === "genuine" ? "indexorg2.html" : "Fake2.html");
};

if (!code) {
  showFailure("No part code found. Please scan the QR code again.");
} else {
  const script = document.createElement("script");
  script.src = SCRIPT_URL + "?c=" + encodeURIComponent(code) + "&callback=" + callbackName;
  script.onerror = function () {
    showFailure("Could not verify the part. Please check your internet connection and try again.");
  };
  document.body.appendChild(script);

  setTimeout(function () {
    showFailure("Verification timed out. Please try again.");
  }, 15000);
}
</script>
</body>
</html>
