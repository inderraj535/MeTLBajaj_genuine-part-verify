:root{--blue:#00529B;--navy:#0B3D91;--gold:#F6B800;--bg:#F2F5FA;--ink:#1B2530}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:22px 16px 30px;text-align:center;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 6px 16px rgba(0,82,155,.3)}

.logo-card img{height:90px;display:block}
header h1{margin:14px 0 0;font-size:20px;letter-spacing:.05em}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
.main{max-width:480px;margin:-16px auto 0;padding:0 16px 30px;text-align:center}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-top:16px}
#reader{width:100%;min-height:10px;border-radius:12px;overflow:hidden}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-blue{background:var(--blue);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.hidden{display:none !important}
.hint{font-size:13px;color:#5b6675;margin-top:8px}
.status{font-size:15px;color:#5b6675;min-height:22px;margin-top:14px;line-height:1.4}
.spinner{width:36px;height:36px;border:4px solid #dbe4f0;border-top-color:var(--blue);border-radius:50%;margin:14px auto 0;animation:spin 1s linear infinite}
footer{margin-top:24px}
footer .label{font-size:12px;color:#7a8594;margin-bottom:8px}
footer .logo-card img{height:60px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<script>
// ===== Settings =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwx0AGdBtvjYW_eEbEIoo6pn6qsl_M37JaIwZxYNCWGYja8htD15RQoiBxavdtPyA_yjQ/exec";
const GENUINE_PAGE = "indexorg2.html";
const DUPLICATE_PAGE = "Fake2.html";
const CODE_PATTERN = /^[A-Za-z0-9_-]{4,40}$/;
const TIMEOUT_MS = 15000;

// ===== Helpers =====
const $ = id => document.getElementById(id);
const urlCode = new URLSearchParams(location.search).get("c");
let scanner = null;   // active Html5Qrcode instance, or null
let busy = false;     // true while starting the camera or checking a code
let counter = 0;

function setStatus(text) { $("status").textContent = text; }
function setSpinner(on) { $("spinner").classList.toggle("hidden", !on); }
function setHint(text) { $("hint").textContent = text; }

// Accepts a full verification link (...?c=CODE) or a bare code. Returns the code text.
function extractCode(text) {
  const t = String(text || "").trim();
  try {
    const c = new URL(t).searchParams.get("c");
    if (c) return c.trim();
  } catch (e) { /* not a URL, treat as bare code */ }
  return t;
}

// Asks the Apps Script whether the code is genuine (JSONP, works on GitHub Pages).
function checkCode(code) {
  return new Promise(function (resolve, reject) {
    const cbName = "verifyCb" + (++counter) + "_" + Date.now();
    const script = document.createElement("script");
    let finished = false;
    let timer = null;

    function cleanup() {
      finished = true;
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
    }

    timer = setTimeout(function () {
      if (finished) return;
      cleanup();
      reject(new Error("The server did not respond in time."));
    }, TIMEOUT_MS);

    window[cbName] = function (data) {
      if (finished) return;
      cleanup();
      resolve(data || {});
    };

    script.onerror = function () {
      if (finished) return;
      cleanup();
      reject(new Error("Could not reach the verification server."));
    };

    script.src = SCRIPT_URL + "?c=" + encodeURIComponent(code) + "&callback=" + cbName;
    document.body.appendChild(script);
  });
}

// Shows an error and a retry button. Retry re-checks the same URL code, or restarts the camera.
function showError(message) {
  busy = false;
  setSpinner(false);
  setStatus(message);
  $("retryBtn").textContent = urlCode ? "Try again" : "Scan again";
  $("retryBtn").classList.remove("hidden");
  if (!urlCode) $("startBtn").classList.add("hidden");
}

async function verifyCode(rawCode) {
  const code = String(rawCode || "").trim();
  busy = true;
  $("retryBtn").classList.add("hidden");
  setSpinner(true);

  if (!CODE_PATTERN.test(code)) {
    showError("This is not a valid Bajaj part code.");
    return;
  }

  setStatus("Checking part...");
  try {
    const data = await checkCode(code);
    // replace() keeps the scan page out of browser history, so Back does not re-check the part
    location.replace(data.status === "genuine" ? GENUINE_PAGE : DUPLICATE_PAGE);
  } catch (err) {
    showError(err.message + " Please try again.");
  }
}

// Called once a QR has been read. Stops the camera, then verifies the code.
async function onScan(decodedText) {
  if (busy || !scanner) return;
  busy = true;
  const instance = scanner;
  scanner = null;
  try { await instance.stop(); } catch (e) {}
  try { instance.clear(); } catch (e) {}
  setHint("");
  verifyCode(extractCode(decodedText));
}

function scanBoxSize(viewWidth, viewHeight) {
  const side = Math.floor(Math.min(viewWidth, viewHeight) * 0.75);
  return { width: side, height: side };
}

async function startScanner() {
  if (busy || scanner) return;
  setStatus("");
  $("retryBtn").classList.add("hidden");

  if (!window.isSecureContext) {
    setStatus("Open this page over https:// to use the camera.");
    return;
  }
  if (typeof Html5Qrcode === "undefined") {
    setStatus("The scanner could not load. Check your internet connection and reload the page.");
    return;
  }

  $("startBtn").classList.add("hidden");
  setStatus("Starting camera...");

  const instance = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: scanBoxSize };
  scanner = instance;   // set before start so an early read is not lost

  try {
    try {
      await instance.start({ facingMode: "environment" }, config, onScan, function () {});
    } catch (firstErr) {
      // Fall back to any camera if the rear camera is not available by name
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) throw firstErr;
      await instance.start(cameras[cameras.length - 1].id, config, onScan, function () {});
    }
    setStatus("Camera ready. Point it at the QR code.");
  } catch (err) {
    scanner = null;
    try { instance.clear(); } catch (e) {}
    $("startBtn").classList.remove("hidden");
    setStatus("Camera could not start. Allow camera access for this site in your browser settings, then try again.");
  }
}

// ===== Start =====
if (urlCode) {
  // Opened from a QR (?c=CODE): check the code directly, no camera needed
  $("scanCard").classList.add("hidden");
  verifyCode(urlCode);
} else {
  $("startBtn").addEventListener("click", startScanner);
}

$("retryBtn").addEventListener("click", function () {
  if (urlCode) verifyCode(urlCode);
  else startScanner();
});
</script>
</body>
