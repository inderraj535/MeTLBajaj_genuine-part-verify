<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111015">
<title>Duplicate Part Alert</title>
<style>
:root{--red:#E51D38;--ink:#20222A;--bg:#111015;--green:#16884E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;justify-content:center}
.screen{width:min(100%,720px);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 24px 34px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 37%,#24131b 0,#111015 68%)}
.topbar{position:absolute;top:0;left:0;right:0;height:10px;background:#d7192d}
.logo-box{margin-top:68px;color:#fff;text-align:center;font-size:clamp(27px,5vw,36px);font-weight:bold;letter-spacing:.03em}
.sub{margin:14px 0 0;color:#c6c6ca;font-size:18px;font-weight:bold;text-align:center}
.badge{margin:24px 0 0;width:260px;height:260px;border:8px solid #78f3b3;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(255,255,255,.07)}
.badge svg{width:150px;height:150px}
.badge path{stroke:#fff;stroke-width:12;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dup{margin:38px 0 0;font-size:clamp(38px,9vw,66px);font-weight:900;color:#58e79a;text-align:center;letter-spacing:.03em;line-height:1.1}
.warn{margin:34px 0 0;font-size:clamp(22px,5vw,34px);font-weight:bold;text-align:center;line-height:1.3}
.warn span{display:block;margin-top:10px;color:#ff4258}
.rule{margin:32px 0 0;width:min(100%,500px);height:6px;border-radius:6px;background:var(--red)}
.box{margin-top:52px;width:min(100%,610px);border:2px solid var(--red);border-radius:28px;padding:30px 24px;background:#fff;color:var(--ink);text-align:center}
.box b{display:block;font-size:clamp(20px,4.5vw,27px);line-height:1.5;margin-bottom:20px}
.box strong{display:block;color:#16884E;font-size:clamp(22px,4.5vw,30px);margin-bottom:8px}
.box span{font-size:clamp(17px,3.8vw,23px);line-height:1.4;color:#363943}
.trust{margin-top:54px;padding:20px 34px;border:2px solid #fff;border-radius:50px;background:#bd142b;color:#fff;text-align:center;font-size:clamp(17px,4vw,24px);font-weight:bold;letter-spacing:.03em}
.thanks{margin:42px 0 0;color:#d4d4d8;text-align:center;font-size:18px;font-weight:bold;letter-spacing:.02em}
@media(max-width:420px){.screen{padding-left:20px;padding-right:20px}.badge{width:230px;height:230px}.badge svg{width:130px;height:130px}.box{margin-top:38px;padding:24px 18px}.trust{padding:18px 24px}}
</style>
</head>
<body>
<div class="screen">
  <div class="topbar" aria-hidden="true"></div>
  <div class="logo-box">BAJAJ GENUINE PARTS</div>
  <p class="sub">AUTHENTICITY VERIFIED</p>
  <div class="badge" role="img" aria-label="Verification check mark">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 52 L40 74 L82 28"/></svg>
  </div>
  <p class="dup">GENUINE!</p>
  <p class="warn">YOUR LIFE. YOUR PRIDE.<span>YOUR GENUINE BAJAJ.</span></p>
  <div class="rule" aria-hidden="true"></div>
  <div class="box">
    <b>Congratulations! You have verified<br>a Genuine Bajaj Original Part.</b>
    <strong>Ride with confidence.</strong>
    <span>Choose quality you can trust.</span>
  </div>
  <div class="trust">GENUINE &bull; TRUSTED &bull; RELIABLE</div>
  <p class="thanks">THANK YOU FOR CHOOSING BAJAJ</p>
</div>
</body>
</html>
