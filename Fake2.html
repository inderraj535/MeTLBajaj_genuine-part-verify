<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate Part Alert</title>
<style>
:root{--red:#C8102E;--ink:#1B2530;--bg:#F7F8FB;--blue:#00529B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);display:flex;justify-content:center}
.screen{width:min(100%,420px);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 22px 30px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 14%,#FBE3E6 0,var(--bg) 55%)}
.topbar{position:absolute;top:0;left:0;right:0;height:10px;background:var(--red);animation:slide 1.1s ease-out both}
.logo-box{margin-top:40px;width:200px;height:200px;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;border-radius:6px;animation:fadeUp .7s .2s ease-out both}
.logo-box b{font-size:30px;letter-spacing:.04em;line-height:1}
.logo-box span{font-size:20px;margin-top:8px;letter-spacing:.06em}
h1{margin:26px 0 0;font-size:34px;line-height:1.1;text-align:center;color:var(--red);letter-spacing:.02em;animation:fadeUp .6s .5s ease-out both}
.sub{margin:8px 0 0;font-size:15px;font-weight:bold;letter-spacing:.12em;animation:fadeUp .6s .8s ease-out both}
.badge{margin:24px 0 0;width:150px;height:150px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;animation:pop .7s 1.1s cubic-bezier(.2,1.6,.4,1) both,pulse 2s 2s ease-in-out infinite}
.badge svg{width:84px;height:84px}
.badge path{stroke:#fff;stroke-width:14;fill:none;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .6s 1.6s ease-out forwards}
.dup{margin:24px 0 0;font-size:24px;font-weight:bold;color:var(--red);text-align:center;letter-spacing:.04em;line-height:1.25;animation:fadeUp .6s 1.9s ease-out both}
.warn{margin:12px 0 0;font-size:17px;font-weight:bold;text-align:center;line-height:1.35;animation:fadeUp .6s 2.2s ease-out both}
.box{margin-top:22px;width:100%;border:2px solid var(--red);border-radius:14px;padding:14px 16px;background:#fff;text-align:center;animation:fadeUp .6s 2.5s ease-out both}
.box b{display:block;color:var(--red);font-size:15px;margin-bottom:4px}
.box span{font-size:14px;line-height:1.4}
.ticker{margin-top:auto;padding-top:24px;width:100%;text-align:center;animation:fadeUp .6s 2.8s ease-out both}
.ticker .a{font-size:20px;font-weight:bold;margin:0;letter-spacing:.03em}
.ticker .b{display:inline-block;margin:14px 0 0;background:var(--blue);color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:19px;font-weight:500;letter-spacing:0;line-height:1.3;padding:14px 18px;border-radius:4px;max-width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}50%{box-shadow:0 0 0 18px rgba(200,16,46,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.badge path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="screen">
  <div class="topbar"></div>
  <div class="logo-box"><b>SAFETY</b><span>ALERT</span></div>
  <h1>STOP!</h1>
  <p class="sub">SAFETY ALERT!</p>
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 100 100"><path d="M24 24 L76 76 M76 24 L24 76"/></svg>
  </div>
  <p class="dup">DUPLICATE – NOT GENUINE</p>
  <p class="warn">THIS IS A DUPLICATE PART – NOT A GENUINE BAJAJ PART!</p>
  <div class="box">
    <b>Fake parts can fail unexpectedly</b>
    <span>damage your bike and put your life and the lives of others at risk.</span>
  </div>
  <div class="ticker">
    <p class="a">DON'T RISK YOUR LIFE WITH FAKE PARTS!</p>
    <p class="b">Always Choose Bajaj Genuine Parts</p>
  </div>
</div>
</body>
</html>
