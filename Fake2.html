<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part Not Genuine</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff4f4;
      color: #4f1d1d;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      padding: 30px 24px;
    }
    .result-gif {
      display: block;
      width: 160px;
      height: auto;
      margin: 0 auto 18px;
      border-radius: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #b42318;
    }
    p {
      margin: 0;
      line-height: 1.6;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="result-gif" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Fake part alert animation">
    <h1>Fake Part</h1>
    <p>The part code does not match a genuine Bajaj product. Please check the original product or contact support.</p>
  </div>
</body>
</html>
